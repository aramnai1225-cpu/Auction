<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auction Registration</title>

    <!-- External CSS file -->
    <link rel="stylesheet" href="css/style.css">

    <!-- External JavaScript file -->
    <script src="js/script.js" defer></script>
</head>

<body>

    <!-- Navigation menu -->
    <nav class="navbar">
        <div class="logo">Auction</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="info.html">Information</a></li>
            <li><a href="register.html">Registration</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="card.html">Cart</a></li>
            <li><a href="checkout.html">Checkout</a></li>
        </ul>
    </nav>

    <!-- Registration page section -->
    <section class="register-section">

        <h1>Register for Upcoming Auction</h1>

        <p>Select the auction date and complete your registration.</p>

        <!-- Auction information box -->
        <div class="auction-box">
            <h2>Next Auction Date</h2>
            <p><b>15 April 2026</b></p>
            <p>Location: Online Auction Platform</p>
        </div>

        <!-- Registration form -->
        <form id="registerForm">

            <!-- Full name input -->
            <label>Full Name:</label>
            <input type="text" id="name">

            <!-- Email input -->
            <label>Email:</label>
            <input type="text" id="email">

            <!-- Phone input -->
            <label>Phone Number:</label>
            <input type="text" id="phone">

            <!-- Auction type selection -->
            <label>Select Auction Type:</label>
            <select id="type">
                <option value="">--Select--</option>
                <option>Vehicles</option>
                <option>Property</option>
                <option>Electronics</option>
                <option>Luxury Items</option>
            </select>

            <!-- Password input -->
            <label>Password:</label>
            <input type="password" id="password">

            <h4>Registration Fee: €20</h4>

            <!-- Register button -->
            <button type="button" onclick="saveRegistration()">
                Register
            </button>

        </form>

        <!-- Message area -->
        <p id="message"></p>

    </section>

</body>
</html>
