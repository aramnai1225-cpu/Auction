<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation menu -->
    <nav class="navbar">
        <div class="logo">Auction</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="info.html">Information</a></li>
            <li><a href="register.html">Registration</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="card.html">Cart</a></li>
            <li><a href="checkout.html">Checkout</a></li>
        </ul>
    </nav>

    <!-- Checkout section -->
    <section class="checkout-section">
        <h1>Checkout</h1>

        <!-- Checkout form -->
        <form onsubmit="completeCheckout(); return false;" class="checkout-form">

            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Delivery Address</label>
            <input type="text" id="address" placeholder="Enter your address" required>

            <label>Card Number</label>
            <input type="text" id="cardNumber" placeholder="Enter 16 digit card number" required>

            <button type="submit">Place Order</button>
        </form>

        <p id="paymentMessage"></p>
    </section>

    <script>
        // Complete checkout process and save order to MySQL
        function completeCheckout() {

            let fullname = document.getElementById("fullName").value;
            let email = document.getElementById("email").value;
            let address = document.getElementById("address").value;
            let cardNumber = document.getElementById("cardNumber").value;

            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            let total = 0;

            cart.forEach(item => {
                total += Number(item.price);
            });

            // Validation patterns
            let namePattern = /^[A-Za-z\s]+$/;
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            let cardPattern = /^\d{16}$/;

            if (!namePattern.test(fullname)) {
                alert("Full name must contain only letters.");
                return;
            }

            if (!emailPattern.test(email)) {
                alert("Please enter a valid email address.");
                return;
            }

            if (address === "") {
                alert("Please enter your delivery address.");
                return;
            }

            if (!cardPattern.test(cardNumber)) {
                alert("Card number must be 16 digits.");
                return;
            }

            if (cart.length === 0) {
                alert("Your cart is empty.");
                return;
            }

            // Send order data to backend API
            fetch("/api/orders", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    fullname: fullname,
                    email: email,
                    address: address,
                    total: total
                })
            })
            .then(res => res.json())
            .then(data => {
                localStorage.removeItem("cart");

                document.getElementById("paymentMessage").innerHTML =
                    "✅ Payment Successful! Order saved successfully.";

                document.querySelector(".checkout-form").reset();
            })
            .catch(err => {
                console.log(err);
                alert("Order failed.");
            });
        }
    </script>

</body>
</html>
